<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>DAYMARK — Make every day count</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f7f7fb;background:#101119;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}body[data-theme=light]{--bg:#f4f2f0;--card:#fff;--fg:#24212b;--muted:#77717e;--line:#e8e5e9;--input:#f4f2f5}body[data-theme=dark]{--bg:#101119;--card:#1b1d29;--fg:#f7f7fb;--muted:#9c9da9;--line:#303241;--input:#262836}body[data-theme=forest]{--bg:#101c18;--card:#1b3028;--fg:#effaf3;--muted:#a1b9ad;--line:#355045;--input:#243b31}body[data-theme=rose]{--bg:#241720;--card:#382531;--fg:#fff4f7;--muted:#cbaebd;--line:#593c4d;--input:#462e3d}body{background:var(--bg);color:var(--fg);transition:background .2s}#app{max-width:850px;margin:auto;padding:28px 20px 110px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;font-weight:900;letter-spacing:3px}.eyebrow{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:15px;width:43px;height:43px;font-size:20px}h1{font-size:clamp(35px,7vw,55px);line-height:1.05;letter-spacing:-2px;margin:35px 0 12px}p{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:25px}.primary{border:0;border-radius:16px;padding:14px 19px;background:#c6a5ff;color:#1e1529;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.stat strong{font-size:30px;display:block;margin-bottom:4px}.stat span{font-size:12px;color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:23px 0 14px}.section h2{font-size:18px;letter-spacing:-.4px;margin:0}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:17px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 14px;border-radius:999px}.chip.active{background:var(--fg);color:var(--bg)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.counter{position:relative;border:1px solid var(--line);border-radius:23px;background:var(--card);padding:21px;min-height:224px;overflow:hidden}.counter:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent)}.counter .emoji{font-size:30px}.counter .days{font-size:clamp(47px,7vw,70px);letter-spacing:-4px;font-weight:850;margin:15px 0 0;line-height:1}.counter .unit{font-size:13px;color:var(--muted)}.counter h3{font-size:16px;margin:16px 0 5px}.counter small{color:var(--muted);font-size:12px}.counter .more{position:absolute;right:15px;top:17px;border:0;background:transparent;color:var(--muted);font-size:23px}.progress{height:5px;background:var(--input);border-radius:20px;margin-top:16px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:20px}.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:24px;grid-column:1/-1}.empty .big{font-size:50px}.modalWrap{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:5}.modal{width:min(100%,510px);max-height:94vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:25px 25px 0 0;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 18px}.field{display:block;margin:14px 0;color:var(--muted);font-size:13px;font-weight:700}.field input,.field select{display:block;width:100%;margin-top:7px;background:var(--input);color:var(--fg);border:1px solid var(--line);border-radius:13px;padding:13px;outline:none}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.secondary{border:1px solid var(--line);background:var(--input);color:var(--fg);border-radius:15px;padding:13px;font-weight:700}.danger{color:#ff8997}.detailsHero{text-align:center;padding:24px 0}.detailsHero .number{font-size:100px;font-weight:850;letter-spacing:-6px;line-height:1.1}.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.milestone{text-align:center;background:var(--input);border-radius:13px;padding:13px 4px;font-size:12px;color:var(--muted)}.milestone.done{color:var(--fg);outline:1px solid #b7a0ff}.milestone b{display:block;font-size:20px;margin-bottom:5px}.themeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.themeChoice{border:2px solid transparent;border-radius:13px;padding:20px 3px;text-align:center;font-size:12px}.themeChoice.selected{border-color:#a58bff}.note{font-size:12px;line-height:1.5}.footer{margin-top:40px;text-align:center;font-size:12px;color:var(--muted)}@media(max-width:520px){#app{padding:22px 16px 100px}.cards{grid-template-columns:1fr 1fr;gap:10px}.counter{padding:16px;min-height:209px}.counter .days{font-size:52px}.counter h3{font-size:14px}.stats .stat{padding:13px}.stat strong{font-size:24px}.hero{align-items:center}.primary{padding:13px}.milestones{grid-template-columns:repeat(4,1fr)}}
</style></head><body data-theme="dark"><main id="app"></main><script>
const KEY='daymark_v1';const today=()=>new Date().toLocaleDateString('en-CA');const dateOnly=s=>new Date(s+'T12:00:00');const daysBetween=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);const days=s=>Math.max(0,daysBetween(dateOnly(s),new Date()));const milestones=[1,3,7,14,30,60,90,100,180,365,500,1000];const palette=['#bda2ff','#ffa9b5','#8cdbc0','#ffd18e','#94c8ff','#f3abeb'];const defaults={theme:'dark',items:[]};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}}let filter='All',modal=null,selected=null;const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>dateOnly(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const nextMil=n=>milestones.find(m=>m>n)||Math.ceil((n+1)/365)*365;const icon=(s)=>s||'✨';
function render(){document.body.dataset.theme=state.theme;const items=state.items.filter(x=>filter==='All'||x.category===filter).sort((a,b)=>days(b.date)-days(a.date));const best=Math.max(0,...state.items.map(x=>days(x.date)));const achieved=state.items.reduce((n,x)=>n+milestones.filter(m=>days(x.date)>=m).length,0);document.getElementById('app').innerHTML=`<header class="top"><div class="brand">✦ DAYMARK</div><button class="iconbtn" onclick="showSettings()" aria-label="Settings">⚙</button></header><div class="hero"><div><h1>Make every day<br>count<span style="color:#bda2ff">.</span></h1><p>Your journey, one day at a time.</p></div><button class="primary" onclick="showEditor()">＋ New</button></div><div class="stats"><div class="stat"><strong>${state.items.length}</strong><span>Active counters</span></div><div class="stat"><strong>${best}</strong><span>Longest days</span></div><div class="stat"><strong>${achieved}</strong><span>Milestones hit</span></div></div><div class="section"><h2>Your counters</h2><span class="eyebrow">${items.length} TRACKED</span></div><div class="filters">${['All','Habits','Wellness','Personal','Other'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div><div class="cards">${items.length?items.map(x=>{const d=days(x.date),next=nextMil(d),prev=[0,...milestones.filter(m=>m<=d)].pop();return `<article class="counter" style="--accent:${esc(x.color)}"><span class="emoji">${esc(icon(x.emoji))}</span><button class="more" aria-label="Open counter" onclick="showDetail('${x.id}')">···</button><div class="days">${d}</div><div class="unit">days since</div><h3>${esc(x.title)}</h3><small>${fmt(x.date)} · ${esc(x.category)}</small><div class="progress"><i style="width:${Math.max(0,Math.min(100,100*(d-prev)/(next-prev)))}%"></i></div></article>`}).join(''):`<div class="empty"><div class="big">🌱</div><h2>Your next chapter starts here.</h2><p>Create your first counter to track something meaningful.</p><button class="primary" onclick="showEditor()">Create a counter</button></div>`}</div><div class="footer">A little progress, every single day. ✦</div>${modal||''}`}
window.setFilter=f=>{filter=f;render()};window.closeModal=()=>{modal=null;selected=null;render()};window.showEditor=id=>{const x=state.items.find(x=>x.id===id)||{title:'',date:today(),emoji:'✨',category:'Personal',color:palette[0]};selected=id||null;modal=`<div class="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="top"><h2>${id?'Edit counter':'New counter'}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form onsubmit="submitCounter(event)"><label class="field">What are you tracking?<input name="title" maxlength="60" placeholder="e.g. No nicotine, New beginning" value="${esc(x.title)}" required autofocus></label><div class="formrow"><label class="field">Start date<input name="date" type="date" max="${today()}" value="${esc(x.date)}" required></label><label class="field">Emoji<input name="emoji" maxlength="8" value="${esc(x.emoji)}" placeholder="✨"></label></div><label class="field">Category<select name="category">${['Habits','Wellness','Personal','Other'].map(c=>`<option ${c===x.category?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Accent color<select name="color">${palette.map((c,i)=>`<option value="${c}" ${c===x.color?'selected':''}>${['Lavender','Coral','Mint','Gold','Blue','Pink'][i]}</option>`).join('')}</select></label><div class="actions"><button class="secondary" type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">${id?'Save changes':'Create counter'}</button></div></form></div></div>`;render()};
window.submitCounter=e=>{e.preventDefault();const f=new FormData(e.target),date=f.get('date');if(daysBetween(dateOnly(date),new Date())<0){alert('Choose today or an earlier date.');return}const item={id:selected||('c'+Date.now()+Math.random().toString(36).slice(2,6)),title:String(f.get('title')).trim(),date,emoji:String(f.get('emoji')).trim()||'✨',category:f.get('category'),color:f.get('color')};if(!item.title)return;state.items=selected?state.items.map(x=>x.id===selected?item:x):[item,...state.items];modal=null;selected=null;save()};
window.showDetail=id=>{const x=state.items.find(x=>x.id===id);if(!x)return;const d=days(x.date),next=nextMil(d);modal=`<div class="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="top"><h2>Counter details</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="detailsHero"><div style="font-size:48px">${esc(x.emoji)}</div><h2>${esc(x.title)}</h2><div class="number">${d}</div><p>days since ${fmt(x.date)}</p><p>Next milestone: <b style="color:var(--fg)">${next} days</b> · ${next-d} to go</p></div><h3>Milestones</h3><div class="milestones">${milestones.map(m=>`<div class="milestone ${d>=m?'done':''}"><b>${d>=m?'✓':'◇'}</b>${m} days</div>`).join('')}</div><div class="actions"><button class="secondary" onclick="showEditor('${x.id}')">Edit</button><button class="secondary" onclick="resetCounter('${x.id}')">Reset to today</button></div><div class="actions"><button class="secondary" onclick="shareCounter('${x.id}')">Share progress</button><button class="secondary danger" onclick="deleteCounter('${x.id}')">Delete</button></div></div></div>`;render()};
window.resetCounter=id=>{if(confirm('Reset this counter to today?')){state.items=state.items.map(x=>x.id===id?{...x,date:today()}:x);modal=null;save()}};window.deleteCounter=id=>{if(confirm('Permanently delete this counter?')){state.items=state.items.filter(x=>x.id!==id);modal=null;save()}};window.shareCounter=async id=>{const x=state.items.find(x=>x.id===id);const message=`${x.emoji} ${days(x.date)} days since ${x.title} — tracked with DAYMARK`;try{if(navigator.share)await navigator.share({text:message});else if(navigator.clipboard){await navigator.clipboard.writeText(message);alert('Progress copied!')}else prompt('Copy your progress:',message)}catch(e){if(e.name!=='AbortError')prompt('Copy your progress:',message)}};
window.showSettings=()=>{modal=`<div class="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="top"><h2>Personalize</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p>Choose your look</p><div class="themeGrid">${[['dark','#1b1d29','#f7f7fb'],['light','#f4f2f0','#24212b'],['forest','#1b3028','#effaf3'],['rose','#382531','#fff4f7']].map(([n,b,c])=>`<button class="themeChoice ${state.theme===n?'selected':''}" style="background:${b};color:${c}" onclick="setTheme('${n}')">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div><h3>Backup your progress</h3><p class="note">Your counters are saved locally in this browser. Export a backup before clearing browser data or switching devices.</p><div class="actions"><button class="secondary" onclick="exportData()">↓ Export backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">↑ Import backup</button></div><input hidden id="importFile" type="file" accept="application/json,.json" onchange="importData(event)"><div class="actions"><button class="secondary danger" onclick="clearAll()">Delete all counters</button></div></div></div>`;render()};window.setTheme=t=>{state.theme=t;save();showSettings()};window.exportData=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daymark-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.importData=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.items)||!data.items.every(x=>typeof x.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error('Invalid backup');if(confirm('Replace current counters with imported counters?')){state={theme:['dark','light','forest','rose'].includes(data.theme)?data.theme:'dark',items:data.items.map(x=>({...x,id:String(x.id||Math.random()),category:['Habits','Wellness','Personal','Other'].includes(x.category)?x.category:'Other',color:palette.includes(x.color)?x.color:palette[0]}))};modal=null;save()}}catch{alert('Could not import this backup file.')}};window.clearAll=()=>{if(confirm('Delete ALL counters? This cannot be undone.')){state.items=[];modal=null;save()}};render();
</script></body></html>
